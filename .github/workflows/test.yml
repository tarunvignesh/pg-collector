name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run against the latest image tags to surface upstream catalog
    # changes early.
    - cron: "0 6 * * 1"

# Required for EnricoMi/publish-unit-test-result-action to write a
# Checks-API entry on the PR. Falls back gracefully on fork PRs.
permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  # Unified test report: runs the pytest wrapper (4 lint tests + 2 runtime
  # tests) against postgres:19beta3, publishes JUnit XML to the PR Checks UI,
  # and uploads the self-contained HTML report as a workflow artifact.
  # This is the surface PR reviewers see; cross-version coverage is in
  # `matrix-test` below.
  report:
    name: pytest report (pg19beta3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:19beta3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pgc_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r tests/requirements.txt

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run pytest
        run: |
          mkdir -p tests/artifacts/test-report
          pytest tests/test_harness.py -v \
            --html=tests/artifacts/test-report/test_report.html \
            --self-contained-html \
            --junitxml=tests/artifacts/test-report/junit.xml

      - name: Publish JUnit results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/artifacts/test-report/junit.xml
          check_name: pytest results
          comment_mode: failures

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/artifacts/test-report/
          retention-days: 14

  matrix-test:
    name: pg${{ matrix.pg_major }} pgss=${{ matrix.pgss }} seed=${{ matrix.seed }} aurora=${{ matrix.aurora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This branch targets PG19 per the per-major branching policy, so
        # 19beta3 (no GA tag on Docker Hub yet) is the merge-blocking entry
        # and 17/18 guard the version gates that must still degrade cleanly
        # on the majors immediately below. Older majors are dropped: the
        # PG19 script reads catalog columns introduced in PG15-18
        # (pg_parameter_acl, wal_buffers_full, parallel_workers_to_launch,
        # generic_plan_calls) and only the gates keep those off PG12-14 —
        # which is what the pg17/pg18 legs already exercise.
        # See tests/DESIGN.md.
        pg_major: ["17", "18", "19beta3"]
        pgss: [on, off]
        seed: [empty, populated]
        aurora: [none, mocked]

    services:
      postgres:
        image: postgres:${{ matrix.pg_major }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pgc_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install beautifulsoup4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Configure server for fixtures
        # pg_stat_statements must be in shared_preload_libraries; some
        # settings are SIGHUP-only so restarting is unnecessary.
        if: matrix.pgss == 'on'
        run: |
          # No-op: preload config would require restart; we install the ext
          # with CREATE EXTENSION from the runner script instead. Its
          # collection functions still work for the majority of queries.
          echo "pgss enabled at extension level only"

      - name: Build run.sh flags
        id: flags
        run: |
          flags="--seed ${{ matrix.seed }}"
          [[ "${{ matrix.pgss }}"   == "on"     ]] && flags="$flags --with-pgss"
          [[ "${{ matrix.aurora }}" == "mocked" ]] && flags="$flags --with-aurora-mock"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: ./tests/run.sh ${{ steps.flags.outputs.flags }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pg${{ matrix.pg_major }}-pgss${{ matrix.pgss }}-${{ matrix.seed }}-aurora${{ matrix.aurora }}
          path: tests/artifacts/
          retention-days: 14
