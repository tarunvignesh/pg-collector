<script>
'use strict';

/* ###########################################################
 * #                                                         #
 * #             1. CONFIG  ←  edit this section             #
 * #                                                         #
 * ########################################################### */

/* -----------------------------------------------------------------
 * RUBRIC — severity classification
 * -----------------------------------------------------------------
 * First matching pattern wins. Default for unmatched: 'note'.
 *
 * Each entry:
 *   sev:   'crit' | 'warn' | 'note'
 *   re:    RegExp tested against the observation text (case-insens)
 *   label: short human label shown in findings
 *   why:   one-line rationale shown as tooltip + in rubric modal
 *
 * To add a check, append an object. To downgrade an existing
 * classification, change its `sev`. Order matters when patterns
 * could overlap.
 * ----------------------------------------------------------------- */
const RUBRIC = [
  // CRITICAL — data integrity / security / wraparound
  { sev: 'crit', re: /without\s*ssl/i,
    label: 'Connections without SSL',
    why: 'Unencrypted client connections expose credentials and traffic.' },
  { sev: 'crit', re: /invalid\s+(indexes|index)/i,
    label: 'Invalid indexes',
    why: 'Index marked invalid takes space, isn\'t used; needs REINDEX or drop.' },
  { sev: 'crit', re: /invalid\s+database/i,
    label: 'Invalid databases',
    why: 'Database in a state that prevents normal operation.' },
  { sev: 'crit', re: /wraparound/i,
    label: 'TXID/MXID wraparound risk',
    why: 'Transaction-ID exhaustion approaching; data corruption / outage risk.' },
  { sev: 'crit', re: /logical\s+replication\s+spill/i,
    label: 'Logical replication spill files',
    why: 'Decoded WAL spilling to disk — replication lag and disk-pressure risk.' },

  // WARNING — operational degradation, near-immediate impact
  { sev: 'warn', re: /20\s*%\s*dead\s+rows|tables\s+that\s+have\s+more\s+than\s+20/i,
    label: 'Tables >20% dead rows',
    why: 'Vacuum is falling behind; bloat impacts read latency and disk usage.' },
  { sev: 'warn', re: /autovacuum_enabled\s*=\s*off|autovacuum\s+disabled\s*\(autovacuum_enabled/i,
    label: 'Per-table autovacuum off',
    why: 'Specific tables won\'t vacuum automatically — bloat will accumulate.' },
  { sev: 'warn', re: /autovacuum\s+parameter\s+is\s+disabled/i,
    label: 'autovacuum parameter disabled',
    why: 'Cluster-wide autovacuum is off — every table will bloat.' },
  { sev: 'warn', re: /sequences?\s+with\s+less\s+than\s+10/i,
    label: 'Sequence near max',
    why: 'Will throw errors on next nextval() once exhausted.' },
  { sev: 'warn', re: /inactive\s+replication\s+slots?/i,
    label: 'Inactive replication slots',
    why: 'Idle slots prevent VACUUM and pin WAL — disk will fill.' },
  { sev: 'warn', re: /synchronous_commit/i,
    label: 'synchronous_commit off',
    why: 'Trades durability for throughput — committed transactions can be lost on crash.' },
  { sev: 'warn', re: /orphaned\s+prepared/i,
    label: 'Orphaned prepared transactions',
    why: 'Prepared txn held > threshold; pins resources, blocks vacuum.' },

  // NOTICE — configuration choices, perf hints
  { sev: 'note', re: /duplicate\s+indexes/i,
    label: 'Duplicate indexes',
    why: 'Wastes disk and slows writes; usually safe to drop one.' },
  { sev: 'note', re: /unused\s+indexes/i,
    label: 'Unused indexes',
    why: 'Indexes with zero scans accumulate write overhead; review before dropping.' },
  { sev: 'note', re: /track_counts/i,
    label: 'track_counts off',
    why: 'Disables stats collector — autovacuum and pg_stat_* views go stale.' },
  { sev: 'note', re: /enable_indexonlyscan/i,
    label: 'enable_indexonlyscan off',
    why: 'Planner can\'t use index-only scans; usually a perf regression.' },
  { sev: 'note', re: /enable_indexscan/i,
    label: 'enable_indexscan off',
    why: 'Planner can\'t use any index scan; almost always a perf regression.' },
  { sev: 'note', re: /log_statement/i,
    label: 'log_statement = all/mod',
    why: 'Logs every query/mutation — disk and perf cost; usually only for debug.' },
  { sev: 'note', re: /log_min_duration_statement/i,
    label: 'log_min_duration_statement = 0',
    why: 'Logs every query duration — high log volume.' },
  { sev: 'note', re: /upgrade\s+available|outdated\s+extensions?/i,
    label: 'Outdated extensions',
    why: 'Newer extension version available; review changelog before upgrading.' },
];

/* -----------------------------------------------------------------
 * SECTION_GROUPS — categorize sections in the sidebar
 * -----------------------------------------------------------------
 * Sidebar entries are grouped under named headings. Sections not
 * listed in any group fall through to the "Other" group (rendered
 * automatically). Within a group, sections appear in this order.
 *
 * Section IDs are the anchor names used by pg_collector.sql
 * (e.g. <a name="Database_size"></a>). To find new ones, run
 * the script and view source.
 *
 * To remove grouping entirely (flat list), set this to [].
 * ----------------------------------------------------------------- */
const SECTION_GROUPS = [
  { label: 'Storage', sections: [
      'Database_size', 'Table_Size', 'index_Size', 'Tablespaces_Info',
      'Toast_Tables_Mapping', 'Temp_tables', 'Large_objects',
      'unlogged_tables', 'Partition_tables',
  ]},
  { label: 'Performance', sections: [
      'pg_stat_statements_extension', 'table_Access_Profile',
      'Index_Access_Profile', 'Unused Indexes', 'DB_Load',
      'functions_statistics', 'Memory_setting',
  ]},
  { label: 'Vacuum & wraparound', sections: [
      'vacuum_Statistics', 'Fragmentation',
      'Transaction_ID_TXID', 'Multixact_ID_MXID',
  ]},
  { label: 'Replication & sessions', sections: [
      'Replication', 'sessions_info', 'background_processes',
  ]},
  { label: 'Schema', sections: [
      'Schema_Info', 'public_Schema', 'invalid_indexes',
      'Duplicate_indexes', 'FK_without_index',
      'PK_FK_using_numeric_or_integer_data_type',
      'sequences', 'triggers',
  ]},
  { label: 'Security & access', sections: [
      'Users_Roles_Info', 'access_privileges', 'default_access_privileges',
      'ssl', 'pg_hba.conf', 'Orphaned_prepared_transactions',
  ]},
  { label: 'Configuration', sections: [
      'DB_parameters', 'Extensions', 'pg_config',
      'pgaudit_extension', 'pg_shdepend', 'Invalid_databases',
  ]},
  { label: 'Aurora', sections: [
      'Aurora_reader_instances-Replica_Lag',
      'Aurora_cluster_cache_management_(CCM)',
      'Aurora_global_db_status', 'Aurora_wait_event_stat',
      'query_plan_management', 'Aurora_dml_activity',
      'process_memory_context_usage',
      'logical_replication_write_through_cache',
  ]},
];

/* -----------------------------------------------------------------
 * LABELS — text strings shown in the UI
 * -----------------------------------------------------------------
 * Edit any of these to change wording. For i18n, swap the whole
 * object based on a locale.
 * ----------------------------------------------------------------- */
const LABELS = {
  appName: 'pg_collector',
  dropzoneTitle: 'pg_collector — modern view',
  dropzoneBlurb: 'Drop a <code>pg_collector_*.html</code> file here',
  dropzoneBtn: 'Choose file',
  dropzoneHint: 'Reads the report locally in your browser. Nothing is uploaded.<br>Original report is not modified.',
  searchPlaceholder: 'Filter sections…',
  databaseOverview: 'Database overview',
  detailSections: 'Detail sections',
  heroCritical: 'Critical',
  heroWarnings: 'Warnings',
  heroNotices: 'Notices',
  heroSections: 'Sections with content',
  noIssues: 'No issues flagged',
  whyRubric: 'Why these severities?',
  rubricTitle: 'Severity rubric',
  rubricBlurb: 'Severities are an opinion of this viewer, not the original script. They\'re meant to nudge attention; you should overrule them based on your own context and risk tolerance.',
  uncategorized: 'Other',
  footer: 'Disagree with how a check was classified? Open an issue at <a href="https://github.com/awslabs/pg-collector/issues" target="_blank">awslabs/pg-collector</a> or fork and edit the rubric in <code>tools/enhance.html</code>.<br><br><small>The stylized elephant mark is inspired by PostgreSQL\'s Slonik. Postgres&reg; and the elephant logo are trademarks of the PostgreSQL Global Development Group.</small>',
};

/* -----------------------------------------------------------------
 * DEFAULTS — initial UI state
 * ----------------------------------------------------------------- */
const DEFAULTS = {
  // Severity blocks expanded on initial render
  expandedBlocks: ['crit', 'warn'],
  // Hide sections whose only content is "no X found" placeholder text
  hideEmptySections: true,
  // Initial theme: 'auto' | 'light' | 'dark' | (any custom theme name)
  initialTheme: 'auto',
};

/* ###########################################################
 * #                                                         #
 * #               2. PARSING  (rarely edited)               #
 * #                                                         #
 * ########################################################### */

function parseReport(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const titleEl = doc.querySelector('h1');
  const title = titleEl ? titleEl.textContent.trim() : 'PG Collector';
  const dbInfo = extractDbInfo(doc);
  const observations = extractObservations(doc);
  const sections = extractSections(doc);
  // Augment sections with structured data where we know the schema. This is
  // the foundation for future tooling (sqlite export, comparison, etc.).
  for (const s of sections) {
    if (s.anchor === 'DB_parameters') s.params = parseParamsTable(s);
  }
  return { title, dbInfo, observations, sections };
}

/* Extract { name, setting, unit, category, short_desc, source, ... } records
 * from the params table inside the DB Parameters section. Used both by the
 * UI (for the redesigned grouped view) and exposed via window.pgcReport
 * for downstream tooling. */
function parseParamsTable(section) {
  const wrap = document.createElement('div');
  wrap.innerHTML = section.html;
  const tbl = [...wrap.querySelectorAll('table')].find(t => {
    const hs = [...t.querySelectorAll('th')].map(th => th.textContent.trim().toLowerCase());
    return hs.includes('name') && hs.includes('setting') && hs.includes('category');
  });
  if (!tbl) return [];
  const headers = [...tbl.querySelectorAll('th')].map(th => th.textContent.trim().toLowerCase());
  const rows = [...tbl.querySelectorAll('tr')].slice(1);
  return rows.map(r => {
    const cells = [...r.querySelectorAll('td')].map(td => td.textContent.replace(/ /g, ' ').trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = cells[i] || ''; });
    return obj;
  });
}

function extractDbInfo(doc) {
  const info = {};
  const allText = doc.body.innerText || '';
  const hostMatch = allText.match(/PG Host Name\s*\/?\s*PG RDS ENDPOINT:\s*(\S+)/i);
  if (hostMatch) info.host = hostMatch[1];
  const serverMatch = allText.match(/^(Aurora-[\d.]+[^\n]*|RDS-[\d.]+[^\n]*|pg-[\d.]+[^\n]*)$/m);
  if (serverMatch) info.server = serverMatch[1].trim();
  if (/Primary\/writer\s*DB/i.test(allText)) info.mode = 'Primary (read/write)';
  else if (/Standby\/Reader\s*DB/i.test(allText)) info.mode = 'Standby (read-only)';

  const firstTable = doc.querySelector('table');
  if (firstTable) {
    const headers = [...firstTable.querySelectorAll('th')].map(t => t.textContent.trim());
    const cells = [...firstTable.querySelectorAll('tr')].slice(1, 2).flatMap(
      r => [...r.querySelectorAll('td')].map(c => c.textContent.trim())
    );
    headers.forEach((h, i) => { if (cells[i]) info[h.toLowerCase()] = cells[i]; });
  }
  return info;
}

function extractObservations(doc) {
  const fonts = [...doc.querySelectorAll('font')];
  const obsHeader = fonts.find(f => /^observations\s*$/i.test(f.textContent.trim()));
  const obs = [];
  if (obsHeader) {
    let node = obsHeader.parentNode.nextSibling;
    while (node) {
      if (node.nodeType === Node.ELEMENT_NODE) {
        if (node.tagName === 'A' && node.getAttribute('name')) break;
        const txt = (node.textContent || '').trim();
        if (txt.startsWith('→') || txt.startsWith('→')) {
          const linkEl = node.querySelector ? node.querySelector('a[href^="#"]') : null;
          obs.push({
            text: txt,
            link: linkEl ? linkEl.getAttribute('href') : null,
            linkLabel: linkEl ? linkEl.textContent : null,
          });
        }
      }
      node = node.nextSibling;
    }
  }
  // Fallback: scan body HTML for arrow-prefixed observation patterns
  if (obs.length === 0) {
    const bodyHtml = doc.body.innerHTML;
    const rx = /→\s*([^<]+?)\s*<a[^>]+href="(#[^"]+)"[^>]*>([^<]+)<\/a>\s*\./g;
    let m;
    while ((m = rx.exec(bodyHtml))) {
      obs.push({
        text: `→ ${m[1].trim()} ${m[3]} .`,
        link: m[2],
        linkLabel: m[3],
      });
    }
  }
  return obs;
}

function extractSections(doc) {
  // psql's HTML output emits <p>(N rows)</p> after each result table; the HTML5
  // parser implicitly opens/closes <p> blocks, which means anchors after the
  // first one end up nested inside <p> elements rather than being body-level
  // siblings of the first anchor. Sibling-walking can't traverse this — we
  // need cross-tree extraction. The Range API does that natively.
  const anchors = [...doc.querySelectorAll('a[name]')]
    .filter(a => a.getAttribute('name') && a.getAttribute('name') !== 'top');
  const sections = [];
  for (let i = 0; i < anchors.length; i++) {
    const a = anchors[i];
    const next = anchors[i + 1] || null;

    // Title detection still works via siblings: the <font size+2> title is
    // always emitted right after each anchor at the same parent level.
    let titleEl = a.nextElementSibling;
    while (titleEl && titleEl.tagName !== 'FONT') titleEl = titleEl.nextElementSibling;
    const title = titleEl ? titleEl.textContent.trim() : a.getAttribute('name');

    // Range from after-this-anchor to before-next-anchor (or end-of-body).
    const range = doc.createRange();
    range.setStartAfter(a);
    if (next) range.setEndBefore(next);
    else      range.setEndAfter(doc.body.lastChild);

    const fragment = range.cloneContents();
    const wrap = doc.createElement('div');
    wrap.appendChild(fragment);

    // psql wraps result tables with <p>(N rows)</p>; the HTML5 parser then
    // re-parents subsequent content into those <p>s. Unwrap top-level <p>s
    // so the rendered section reads as flat content.
    unwrapTopLevelPs(wrap);

    // Strip the title font + the <hr> that follows it from the wrap.
    stripLeadingTitle(wrap);

    sections.push({
      anchor: a.getAttribute('name'),
      title,
      html: wrap.innerHTML.trim(),
      text: (wrap.textContent || '').trim(),
      empty: isEmptySection(wrap.textContent || ''),
    });
  }
  return sections;
}

// Remove the first <font size="+2"> (the section title we already captured)
// and the <hr> that immediately follows it. Both are inside <p> wrappers
// for non-first sections, so we descend into element children when needed.
function stripLeadingTitle(root) {
  // Find the first <font size="+2"> in document order
  const titleFont = root.querySelector('font[size="+2"]');
  if (!titleFont) return;
  // Find the first <hr> that comes after the title font in document order
  let hr = null;
  let n = titleFont;
  while ((n = nextNodeInOrder(n))) {
    if (n.nodeType === 1 && n.tagName === 'HR') { hr = n; break; }
    if (n.nodeType === 1 && n.tagName !== 'P' && n.tagName !== 'BR') break;
  }
  if (titleFont.parentNode) titleFont.parentNode.removeChild(titleFont);
  if (hr && hr.parentNode) hr.parentNode.removeChild(hr);
}

function nextNodeInOrder(node) {
  if (node.firstChild) return node.firstChild;
  while (node) {
    if (node.nextSibling) return node.nextSibling;
    node = node.parentNode;
  }
  return null;
}

function unwrapTopLevelPs(root) {
  // For each <p> that's a direct child of root, replace it with its children.
  // Repeat until no more top-level <p>s — handles nested cases.
  let changed = true;
  let safety = 100;
  while (changed && safety-- > 0) {
    changed = false;
    for (const p of [...root.children]) {
      if (p.tagName === 'P') {
        while (p.firstChild) root.insertBefore(p.firstChild, p);
        root.removeChild(p);
        changed = true;
      }
    }
  }
}

function isEmptySection(text) {
  const t = text.replace(/\s+/g, ' ').trim();
  if (t.length === 0) return true;
  if (/^This is not Aurora instance$/i.test(t)) return true;
  if (/^No\s+\w+/i.test(t) && t.length < 120) return true;
  return false;
}

function classify(text) {
  for (const r of RUBRIC) if (r.re.test(text)) return r;
  return { sev: 'note', label: 'Other', why: 'Not in the built-in rubric — defaulting to notice.' };
}

/* ============================================================
 * PGTune — recommended values for selected GUC parameters,
 * given system specs. Adapted from
 * https://github.com/le0pard/pgtune (MIT license).
 * Pure JS, no dependencies. Returns a flat { paramName: value }
 * object with values formatted as Postgres-friendly strings.
 * ============================================================ */
function pgtune(opts) {
  const { totalRamGB, cpuCount, dbType, storage, connections } = opts;
  const RAM_KB = totalRamGB * 1024 * 1024;
  const r = {};

  // max_connections — by workload, unless overridden
  const defaultConn = { web: 200, oltp: 300, dw: 40, desktop: 20, mixed: 100 };
  r.max_connections = String(connections || defaultConn[dbType] || 100);

  // shared_buffers: 25% of RAM
  r.shared_buffers = formatKB(Math.round(RAM_KB / 4));

  // effective_cache_size: 75% of RAM
  r.effective_cache_size = formatKB(Math.round(RAM_KB * 3 / 4));

  // maintenance_work_mem: RAM/16, capped at 2GB
  let mwm = Math.round(RAM_KB / 16);
  if (mwm > 2 * 1024 * 1024) mwm = 2 * 1024 * 1024;
  r.maintenance_work_mem = formatKB(mwm);

  // checkpoint_completion_target — 0.9 (PG default since 14)
  r.checkpoint_completion_target = '0.9';

  // wal_buffers: shared_buffers/32, capped at 16MB, min 32kB
  let wb = Math.round((RAM_KB / 4) / 32);
  if (wb > 16 * 1024) wb = 16 * 1024;
  if (wb < 32) wb = 32;
  r.wal_buffers = formatKB(wb);

  // default_statistics_target
  r.default_statistics_target = (dbType === 'dw') ? '500' : '100';

  // random_page_cost
  r.random_page_cost = (storage === 'hdd') ? '4' : '1.1';

  // effective_io_concurrency
  r.effective_io_concurrency = String({ ssd: 200, san: 300, hdd: 2 }[storage] || 200);

  // work_mem: ((RAM - shared_buffers) / max_connections / 3) / parallel_workers_per_gather, by type
  const mpwpg = Math.max(1, Math.floor(cpuCount / 2));
  const wmDivisor = parseInt(r.max_connections, 10) * 3 * mpwpg;
  let wm = Math.round((RAM_KB - RAM_KB / 4) / wmDivisor);
  const wmMult = { web: 1, oltp: 1, dw: 2, desktop: 1 / 6, mixed: 1 }[dbType] || 1;
  wm = Math.max(64, Math.round(wm * wmMult));
  r.work_mem = formatKB(wm);

  // huge_pages: try when shared_buffers will exceed ~32GB-ish (i.e. RAM ≥ ~32GB)
  r.huge_pages = (totalRamGB >= 32) ? 'try' : 'off';

  // min/max_wal_size
  const walMin = { web: 1024, oltp: 2048, dw: 4096, desktop: 100, mixed: 1024 };
  const walMax = { web: 4096, oltp: 8192, dw: 16384, desktop: 2048, mixed: 4096 };
  r.min_wal_size = `${walMin[dbType] || 1024}MB`;
  r.max_wal_size = `${walMax[dbType] || 4096}MB`;

  // Parallelism — only when we have at least 2 cores
  if (cpuCount >= 2) {
    r.max_worker_processes = String(cpuCount);
    r.max_parallel_workers_per_gather = String(mpwpg);
    r.max_parallel_workers = String(cpuCount);
    r.max_parallel_maintenance_workers = String(mpwpg);
  }

  return r;
}

function formatKB(kb) {
  if (kb >= 1024 * 1024 && kb % (1024 * 1024) === 0) return `${kb / (1024 * 1024)}GB`;
  if (kb >= 1024 && kb % 1024 === 0)                 return `${kb / 1024}MB`;
  if (kb >= 1024)                                    return `${(kb / 1024).toFixed(1)}MB`;
  return `${kb}kB`;
}

/* Compare a current setting (as Postgres reports it) against a recommended
 * value. Returns { same, currentNorm, recNorm } where the norms are
 * canonicalized in kB where possible. Both values are loose-matched
 * because the units in pg_settings can differ from pgtune output. */
function compareSetting(current, currentUnit, recommended) {
  const cur = parseSettingToKB(current, currentUnit);
  const rec = parseSettingToKB(recommended);
  if (cur != null && rec != null) {
    const ratio = cur / rec;
    return { same: ratio >= 0.85 && ratio <= 1.18, current, recommended };
  }
  // Fall back to string compare (case-insensitive)
  return {
    same: String(current).trim().toLowerCase() === String(recommended).trim().toLowerCase(),
    current, recommended,
  };
}

function parseSettingToKB(v, unit) {
  if (v == null || v === '') return null;
  // If we have an explicit unit, multiply
  if (unit) {
    const num = parseFloat(v);
    if (!isFinite(num)) return null;
    const u = unit.trim().toLowerCase();
    const mult = { '8kb': 8, 'kb': 1, 'mb': 1024, 'gb': 1024 ** 2,
                   'b': 1 / 1024, 'ms': null, 's': null, 'min': null };
    if (mult[u] == null) return null;
    return num * mult[u];
  }
  // Otherwise parse a string like "128MB" or "256kB"
  const m = String(v).trim().match(/^([\d.]+)\s*(kb|mb|gb|tb|b)?$/i);
  if (!m) return null;
  const num = parseFloat(m[1]);
  const u = (m[2] || 'kb').toLowerCase();
  const mult = { 'b': 1 / 1024, 'kb': 1, 'mb': 1024, 'gb': 1024 ** 2, 'tb': 1024 ** 3 };
  return num * (mult[u] || 1);
}

/* ###########################################################
 * #                                                         #
 * #            3. RENDER — builds the modern UI             #
 * #                                                         #
 * ########################################################### */

// LAYOUT — apply LABELS to static markup before render
function applyLabels() {
  document.getElementById('dz-title').textContent = LABELS.dropzoneTitle;
  document.getElementById('dz-blurb').innerHTML = LABELS.dropzoneBlurb;
  document.getElementById('dz-btn').textContent = LABELS.dropzoneBtn;
  document.getElementById('dz-hint').innerHTML = LABELS.dropzoneHint;
  document.getElementById('sb-app-name').textContent = LABELS.appName;
  document.getElementById('search').placeholder = LABELS.searchPlaceholder;
  document.getElementById('db-overview-heading').textContent = LABELS.databaseOverview;
  document.getElementById('sections-heading').textContent = LABELS.detailSections;
  document.getElementById('show-rubric').textContent = LABELS.whyRubric;
  document.getElementById('rubric-title').textContent = LABELS.rubricTitle;
  document.getElementById('rubric-blurb').textContent = LABELS.rubricBlurb;
  document.getElementById('footer').innerHTML = LABELS.footer;
}

function applyInitialTheme() {
  if (DEFAULTS.initialTheme && DEFAULTS.initialTheme !== 'auto') {
    document.body.dataset.theme = DEFAULTS.initialTheme;
  }
  // Mark the matching toggle button active
  for (const b of document.getElementById('themetoggle').children) {
    b.classList.toggle('active', b.dataset.themeSet === DEFAULTS.initialTheme);
  }
}

function render(parsed) {
  document.getElementById('title').textContent = parsed.title;
  document.getElementById('sb-version').textContent =
      parsed.title.replace(/^PG\s*COLLECTOR\s*/i, '');

  // Top-bar pills
  const ps = document.getElementById('pill-server');
  const pm = document.getElementById('pill-mode');
  const ph = document.getElementById('pill-host');
  if (parsed.dbInfo.server) ps.innerHTML = `<span class="dot"></span>${escapeHtml(parsed.dbInfo.server)}`;
  if (parsed.dbInfo.mode)   pm.innerHTML = `<span class="dot"></span>${escapeHtml(parsed.dbInfo.mode)}`;
                            pm.classList.toggle('standby', /standby/i.test(parsed.dbInfo.mode || ''));
  if (parsed.dbInfo.host)   ph.textContent = parsed.dbInfo.host;
  for (const el of [ps, pm, ph]) if (!el.textContent && !el.innerHTML) el.classList.add('hidden');

  // Classify and bucket observations
  const classified = parsed.observations.map(o => ({ ...o, ...classify(o.text) }));
  const counts = { crit: 0, warn: 0, note: 0 };
  for (const c of classified) counts[c.sev]++;

  // Hero
  const visibleSections = parsed.sections.filter(s =>
      !DEFAULTS.hideEmptySections || !s.empty);
  const heroEl = document.getElementById('hero');
  heroEl.innerHTML = '';
  heroEl.appendChild(heroCard('crit', counts.crit, LABELS.heroCritical));
  heroEl.appendChild(heroCard('warn', counts.warn, LABELS.heroWarnings));
  heroEl.appendChild(heroCard('note', counts.note, LABELS.heroNotices));
  heroEl.appendChild(heroCard('ok',
      Math.max(0, visibleSections.length - classified.length),
      LABELS.heroSections));

  // Findings — severity-grouped
  const findingsEl = document.getElementById('findings');
  findingsEl.innerHTML = '';
  for (const sev of ['crit', 'warn', 'note']) {
    const items = classified.filter(c => c.sev === sev);
    if (items.length === 0) continue;
    findingsEl.appendChild(severityBlock(sev, items));
  }
  if (classified.length === 0) {
    const ok = document.createElement('div');
    ok.className = 'sev-block';
    ok.style.borderColor = 'var(--ok-bd)';
    ok.innerHTML = `<div class="sev-head" style="background:var(--ok-bg);color:var(--ok-fg)">
      <span class="icon">✓</span><span>${escapeHtml(LABELS.noIssues)}</span></div>`;
    findingsEl.appendChild(ok);
  }

  // DB overview
  const dbi = parsed.dbInfo;
  const cardSpec = [
    ['Host',       dbi.host],
    ['Server',     dbi.server],
    ['Mode',       dbi.mode],
    ['Database',   dbi.db_connected || dbi.dbname],
    ['User',       dbi.user_name || dbi.username],
    ['Port',       dbi['db_port '] || dbi.db_port],
    ['Block size', dbi.block_size],
    ['Started',    dbi.db_start_date],
    ['Up time',    dbi.up_time],
  ];
  const dbGridEl = document.getElementById('db-grid');
  dbGridEl.innerHTML = '';
  for (const [lbl, val] of cardSpec) {
    if (!val) continue;
    const c = document.createElement('div');
    c.className = 'db-card';
    c.innerHTML = `<div class="lbl">${escapeHtml(lbl)}</div><div class="val">${escapeHtml(val)}</div>`;
    dbGridEl.appendChild(c);
  }

  // Per-section issue badges (used in both sidebar nav and section summaries)
  const sectionIssues = new Map();
  for (const c of classified) {
    if (!c.link) continue;
    const anchor = c.link.replace(/^#/, '');
    if (!sectionIssues.has(anchor)) sectionIssues.set(anchor, { crit: 0, warn: 0, note: 0 });
    sectionIssues.get(anchor)[c.sev]++;
  }

  // Sections — render the body, then build the sidebar from groups
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';
  const sectionsByAnchor = new Map();
  for (const s of visibleSections) {
    sectionsByAnchor.set(s.anchor, s);
    sectionsEl.appendChild(renderSectionDetail(s, sectionIssues.get(s.anchor)));
  }
  buildSidebar(visibleSections, sectionsByAnchor, sectionIssues);

  // Show app
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  // Wire up search, theme, modal, scroll-spy
  wireSearch();
  wireTheme();
  wireRubricModal();
  wireScrollSpy();
}

function renderSectionDetail(s, issues) {
  const det = document.createElement('details');
  det.className = 'section';
  det.id = 'sec-' + cssEscape(s.anchor);
  let stamp = '';
  if (issues) {
    if (issues.crit) stamp = `<span class="stamp has-crit">${issues.crit} critical</span>`;
    else if (issues.warn) stamp = `<span class="stamp has-issue">${issues.warn} warning${issues.warn > 1 ? 's' : ''}</span>`;
    else if (issues.note) stamp = `<span class="stamp">${issues.note} notice${issues.note > 1 ? 's' : ''}</span>`;
  }
  det.innerHTML = `
    <summary>
      <span class="chev">›</span>
      <span class="name">${escapeHtml(s.title)}</span>
      ${stamp}
    </summary>
    <div class="section-body">${s.html}</div>
  `;
  // Section-specific post-processing
  const body = det.querySelector('.section-body');
  if (s.anchor === 'DB_parameters' && Array.isArray(s.params) && s.params.length) {
    decorateDbParams(body, s.params);
  }
  // Make every <table> sortable + auto-detect numeric columns
  decorateTables(body);
  // Add inline SVG bars to size-like columns inside this section's tables
  decorateSizeColumns(body);
  return det;
}

/* ============================================================
 * decorateTables — for every <table> in scope:
 *   1. Detect numeric columns (numbers, sizes, durations) and
 *      add a `numeric` class so CSS right-aligns them.
 *   2. Make headers click-to-sort (asc → desc → original order).
 *   3. Sort comparator is type-aware: numeric/size/time first,
 *      string fallback (locale-aware, case-insensitive).
 * ============================================================ */
function decorateTables(scope) {
  if (!scope) return;
  for (const tbl of scope.querySelectorAll('table')) {
    if (tbl.classList.contains('params-raw-table')) continue; // hidden anyway
    const headers = [...tbl.querySelectorAll('th')];
    if (headers.length === 0) continue;
    // Collect data rows (everything after the header row)
    const allRows = [...tbl.querySelectorAll('tr')];
    const headerRow = headers[0].closest('tr');
    const headerRowIdx = allRows.indexOf(headerRow);
    const dataRows = allRows.slice(headerRowIdx + 1).filter(r => r.children.length > 0);
    if (dataRows.length === 0) continue;

    // Cache original order for the third click ("unsorted")
    dataRows.forEach((r, i) => { r.dataset.origIdx = i; });

    // Detect numeric columns (every cell parseable as numeric, ignoring blanks)
    headers.forEach((th, idx) => {
      let numericHits = 0, blankHits = 0, total = dataRows.length;
      for (const r of dataRows) {
        const cell = r.children[idx];
        if (!cell) { blankHits++; continue; }
        const t = (cell.textContent || '').trim();
        if (t === '' || t === ' ') { blankHits++; continue; }
        if (parseNumeric(t) != null) numericHits++;
      }
      const nonBlank = total - blankHits;
      const isNumeric = nonBlank > 0 && (numericHits / nonBlank) >= 0.85;
      if (isNumeric) {
        th.classList.add('numeric');
        for (const r of dataRows) {
          const c = r.children[idx];
          if (c) c.classList.add('numeric');
        }
      }
      th.dataset.colIdx = String(idx);
      th.dataset.sortState = 'none';
      th.title = 'Click to sort';
      th.addEventListener('click', () => sortTable(tbl, idx));
    });
  }
}

function sortTable(tbl, colIdx) {
  const headers = [...tbl.querySelectorAll('th')];
  const allRows = [...tbl.querySelectorAll('tr')];
  const headerRow = headers[0].closest('tr');
  const headerRowIdx = allRows.indexOf(headerRow);
  const dataRows = allRows.slice(headerRowIdx + 1).filter(r => r.children.length > 0);
  if (dataRows.length === 0) return;

  const th = headers[colIdx];
  const cycle = { 'none': 'asc', 'asc': 'desc', 'desc': 'none' };
  const newState = cycle[th.dataset.sortState] || 'asc';

  for (const h of headers) {
    h.classList.remove('sort-asc', 'sort-desc');
    h.dataset.sortState = 'none';
  }

  if (newState === 'none') {
    dataRows.sort((a, b) => +a.dataset.origIdx - +b.dataset.origIdx);
  } else {
    th.classList.add('sort-' + newState);
    th.dataset.sortState = newState;
    const direction = (newState === 'asc') ? 1 : -1;
    dataRows.sort((a, b) => {
      const av = (a.children[colIdx]?.textContent || '').trim();
      const bv = (b.children[colIdx]?.textContent || '').trim();
      return direction * compareCells(av, bv);
    });
  }

  // Re-attach in new order. parentNode handles the case where rows are
  // direct children of the table or nested in a tbody.
  const parent = dataRows[0].parentNode;
  for (const r of dataRows) parent.appendChild(r);
}

function compareCells(a, b) {
  // Empty cells sort last
  const ae = !a || a === ' ';
  const be = !b || b === ' ';
  if (ae && be) return 0;
  if (ae) return 1;
  if (be) return -1;
  // Try numeric
  const an = parseNumeric(a);
  const bn = parseNumeric(b);
  if (an != null && bn != null) return an - bn;
  // String compare
  return a.toLowerCase().localeCompare(b.toLowerCase(), undefined, { numeric: true });
}

/* parseNumeric: parse a cell's text as a number with optional unit.
 * Recognized units: bytes/b, kB/MB/GB/TB/PB, ms/s/min/hour/h.
 * Returns canonical number (bytes for sizes, ms for durations,
 * raw value otherwise) or null if not parseable. */
function parseNumeric(s) {
  if (s == null) return null;
  s = String(s).trim();
  if (!s) return null;
  // Boolean-ish (t/f from psql)
  if (/^[tf]$/i.test(s)) return s.toLowerCase() === 't' ? 1 : 0;
  // Match: optional sign, digits with possible commas/dots, optional unit
  const m = s.match(/^(-?[\d,]*\.?\d+(?:e[+-]?\d+)?)\s*(bytes|byte|b|kb|mb|gb|tb|pb|ms|s|min|mins|hr|hrs|hour|hours|h)?$/i);
  if (!m) return null;
  const num = parseFloat(m[1].replace(/,/g, ''));
  if (!isFinite(num)) return null;
  const u = (m[2] || '').toLowerCase();
  const sizeMult = { '':1,'b':1,'byte':1,'bytes':1,
                     'kb':1024,'mb':1024**2,'gb':1024**3,'tb':1024**4,'pb':1024**5 };
  const timeMult = { 'ms':1,'s':1000,'min':60000,'mins':60000,
                     'hr':3600000,'hrs':3600000,'hour':3600000,'hours':3600000,'h':3600000 };
  const mult = sizeMult[u] != null ? sizeMult[u] : (timeMult[u] != null ? timeMult[u] : 1);
  return num * mult;
}

/* ============================================================
 * decorateDbParams — replaces the original 378-row × 17-column
 * table with: a toolbar (search + non-default toggle + tuning
 * button), a tuning form (collapsed by default), category-grouped
 * collapsible param rows. The original raw table stays available
 * via "Show raw table" toggle.
 * ============================================================ */
function decorateDbParams(scope, params) {
  if (!scope || !params.length) return;
  // Locate the original raw table. In the source markup it's wrapped in a
  // <details> element, so the table is not necessarily a direct child of
  // scope. Walk up from the table to find its top-level ancestor inside
  // scope; we hide that whole subtree (so the <details> disclosure widget
  // doesn't render either) and let the user toggle it back via "Show raw".
  const origTable = [...scope.querySelectorAll('table')].find(t => {
    const hs = [...t.querySelectorAll('th')].map(th => th.textContent.trim().toLowerCase());
    return hs.includes('name') && hs.includes('setting') && hs.includes('category');
  });
  let rawContainer = null;
  if (origTable) {
    rawContainer = origTable;
    while (rawContainer.parentNode && rawContainer.parentNode !== scope) {
      rawContainer = rawContainer.parentNode;
    }
    rawContainer.style.display = 'none';
    origTable.classList.add('params-raw-table');
  }

  // Build toolbar + tuning panel + grouped list
  const container = document.createElement('div');
  container.innerHTML = `
    <div class="params-toolbar">
      <input type="search" id="params-search" placeholder="Search parameter name…">
      <label class="toggle-lbl"><input type="checkbox" id="params-non-default"> Non-default only</label>
      <button id="params-tune-btn" class="secondary">⚙ Suggest tuning</button>
      <span class="params-stats"></span>
    </div>
    <div class="params-tune hidden" id="params-tune">
      <h4>Tune for your system</h4>
      <p style="font-size:.8rem;margin:.25rem 0 .85rem;color:var(--note-fg);opacity:.85">
        Recommendations adapted from <a href="https://github.com/le0pard/pgtune" target="_blank" style="color:inherit;text-decoration:underline">le0pard/pgtune</a>.
        These are starting points, not final answers — measure and adjust.
      </p>
      <div class="params-tune-form">
        <div class="field"><label>RAM (GB)</label><input type="number" id="t-ram" min="0.5" step="0.5" value="8"></div>
        <div class="field"><label>CPU cores</label><input type="number" id="t-cpu" min="1" step="1" value="4"></div>
        <div class="field"><label>Workload</label><select id="t-type">
          <option value="web">Web app</option>
          <option value="oltp">OLTP</option>
          <option value="mixed" selected>Mixed</option>
          <option value="dw">Data warehouse</option>
          <option value="desktop">Desktop</option>
        </select></div>
        <div class="field"><label>Storage</label><select id="t-storage">
          <option value="ssd" selected>SSD</option>
          <option value="hdd">HDD</option>
          <option value="san">SAN</option>
        </select></div>
        <div class="field"><label>Max connections</label><input type="number" id="t-conn" min="1" step="1" placeholder="(by workload)"></div>
      </div>
      <div class="params-tune-actions">
        <button id="t-apply">Compute & overlay on params</button>
        <button id="t-clear" class="secondary">Clear</button>
        <span id="t-status" style="font-size:.8rem;color:var(--note-fg);margin-left:.5rem"></span>
      </div>
    </div>
    <div class="params-list" id="params-list"></div>
    <div class="params-raw-toggle">
      <button class="secondary" id="show-raw" style="font-size:.8rem;padding:.3rem .65rem;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer">Show raw table</button>
    </div>
  `;
  // Prepend to scope. Doing it via firstChild guarantees the call works
  // regardless of whether scope has any children. (The previous code did
  // `insertBefore(container, origTable)` and crashed when origTable was
  // nested inside a <details> wrapper from psql, not a direct child of
  // scope.)
  scope.insertBefore(container, scope.firstChild);

  // Group params by category
  const byCategory = new Map();
  for (const p of params) {
    const cat = p.category || 'Other';
    if (!byCategory.has(cat)) byCategory.set(cat, []);
    byCategory.get(cat).push(p);
  }
  // Stable sort: most non-default first, then alphabetical
  const cats = [...byCategory.entries()].sort((a, b) => {
    const nda = a[1].filter(p => p.source && p.source !== 'default').length;
    const ndb = b[1].filter(p => p.source && p.source !== 'default').length;
    if (nda !== ndb) return ndb - nda;
    return a[0].localeCompare(b[0]);
  });

  const listEl = container.querySelector('#params-list');
  const groupEls = [];
  for (const [cat, items] of cats) {
    const ndCount = items.filter(p => p.source && p.source !== 'default').length;
    const grp = document.createElement('details');
    grp.className = 'params-group';
    grp.open = ndCount > 0;
    const stamp = ndCount > 0 ? `<span class="gnondefault">${ndCount} non-default</span>` : '';
    grp.innerHTML = `
      <summary>
        <span class="chev">›</span>
        <span class="gname">${escapeHtml(cat)}</span>
        ${stamp}
        <span class="gcount">${items.length}</span>
      </summary>
      <div class="params-group-body"></div>
    `;
    const body = grp.querySelector('.params-group-body');
    for (const p of items) {
      body.appendChild(renderParamRow(p));
    }
    listEl.appendChild(grp);
    groupEls.push({ el: grp, items });
  }
  updateStats(container, params, params);

  // Wire toolbar
  const searchEl   = container.querySelector('#params-search');
  const ndToggle   = container.querySelector('#params-non-default');
  const tuneBtn    = container.querySelector('#params-tune-btn');
  const tunePanel  = container.querySelector('#params-tune');
  const showRawBtn = container.querySelector('#show-raw');

  const refilter = () => {
    const q = searchEl.value.trim().toLowerCase();
    const ndOnly = ndToggle.checked;
    let visibleCount = 0;
    for (const g of groupEls) {
      let groupVisible = 0;
      for (const row of g.el.querySelectorAll('.param-row')) {
        const name = row.dataset.name || '';
        const isDefault = row.dataset.default === '1';
        const matches = (!q || name.includes(q)) && (!ndOnly || !isDefault);
        row.classList.toggle('hidden', !matches);
        if (matches) groupVisible++;
      }
      g.el.classList.toggle('hidden', groupVisible === 0);
      if (groupVisible > 0 && (q || ndOnly)) g.el.open = true;
      visibleCount += groupVisible;
    }
    container.querySelector('.params-stats').textContent =
      `${visibleCount} / ${params.length} parameters`;
  };

  searchEl.addEventListener('input', refilter);
  ndToggle.addEventListener('change', refilter);
  tuneBtn.addEventListener('click', () => tunePanel.classList.toggle('hidden'));
  if (showRawBtn && rawContainer) {
    showRawBtn.addEventListener('click', () => {
      const showing = rawContainer.style.display !== 'none';
      rawContainer.style.display = showing ? 'none' : '';
      showRawBtn.textContent = showing ? 'Show raw table' : 'Hide raw table';
    });
  } else if (showRawBtn) {
    showRawBtn.style.display = 'none';
  }

  // Wire tuning form
  const tApply = container.querySelector('#t-apply');
  const tClear = container.querySelector('#t-clear');
  const tStatus = container.querySelector('#t-status');
  tApply.addEventListener('click', () => {
    const opts = {
      totalRamGB: parseFloat(container.querySelector('#t-ram').value) || 8,
      cpuCount:   parseInt(container.querySelector('#t-cpu').value, 10) || 4,
      dbType:     container.querySelector('#t-type').value,
      storage:    container.querySelector('#t-storage').value,
      connections: parseInt(container.querySelector('#t-conn').value, 10) || null,
    };
    const recs = pgtune(opts);
    let applied = 0, divergent = 0;
    for (const row of container.querySelectorAll('.param-row')) {
      const oldTune = row.querySelector('.ptune');
      if (oldTune) oldTune.remove();
      const name = row.dataset.name;
      if (!(name in recs)) continue;
      const cmp = compareSetting(row.dataset.setting, row.dataset.unit, recs[name]);
      const tag = document.createElement('span');
      tag.className = 'ptune' + (cmp.same ? '' : ' divergent');
      tag.textContent = cmp.same
        ? `pgtune: ${recs[name]} (matches)`
        : `pgtune suggests: ${recs[name]}`;
      // Insert after the source badge column (last grid item before wrap)
      row.appendChild(tag);
      applied++;
      if (!cmp.same) divergent++;
    }
    tStatus.textContent = `${applied} parameters covered, ${divergent} differ from current.`;
  });
  tClear.addEventListener('click', () => {
    for (const t of container.querySelectorAll('.ptune')) t.remove();
    tStatus.textContent = '';
  });
}

function renderParamRow(p) {
  const row = document.createElement('div');
  row.className = 'param-row';
  const isDefault = !p.source || p.source === 'default';
  if (!isDefault) row.classList.add('non-default');
  row.dataset.name = (p.name || '').toLowerCase();
  row.dataset.setting = p.setting || '';
  row.dataset.unit = p.unit || '';
  row.dataset.default = isDefault ? '1' : '0';
  const unitDisplay = p.unit ? ` <span class="unit">${escapeHtml(p.unit)}</span>` : '';
  const desc = p.short_desc ? `<div class="pdesc">${escapeHtml(p.short_desc)}</div>` : '';
  row.innerHTML = `
    <span class="pname">${escapeHtml(p.name || '')}</span>
    <span class="pvalue">${escapeHtml(p.setting || '')}${unitDisplay}</span>
    <span class="psource ${isDefault ? '' : 'non-default'}">${escapeHtml(p.source || '?')}</span>
    ${desc}
  `;
  return row;
}

function updateStats(container, all, visible) {
  container.querySelector('.params-stats').textContent =
    `${visible.length} / ${all.length} parameters`;
}

/* Detect tables whose columns contain Postgres-style size values
 * ("7507 kB", "1.2 GB", etc.) and append a small SVG bar to each cell,
 * normalized to the maximum value in that column. Pure inline SVG —
 * no charting library, no external dependency. */
function decorateSizeColumns(scope) {
  if (!scope) return;
  for (const tbl of scope.querySelectorAll('table')) {
    const headers = [...tbl.querySelectorAll('th')].map(t => t.textContent.toLowerCase().trim());
    const sizeCols = headers
      .map((h, i) => /\b(size|bytes|length)\b/.test(h) ? i : -1)
      .filter(i => i >= 0);
    if (sizeCols.length === 0) continue;
    const rows = [...tbl.querySelectorAll('tr')].slice(1);
    for (const col of sizeCols) {
      const values = rows.map(r => {
        const td = r.querySelectorAll('td')[col];
        return td ? parseSize(td.textContent) : null;
      });
      const max = Math.max(...values.filter(v => v != null && v > 0), 0);
      if (!max) continue;
      rows.forEach((r, i) => {
        const v = values[i];
        if (v == null || v <= 0) return;
        const td = r.querySelectorAll('td')[col];
        if (!td || td.querySelector('.sizebar')) return;
        const w = Math.max(2, Math.round(v / max * 80));
        const span = document.createElement('span');
        span.className = 'sizebar';
        span.title = `${(v / max * 100).toFixed(1)}% of largest`;
        span.innerHTML = `<svg width="80" height="6"><rect x="0" y="1" width="${w}" height="4" rx="1" fill="currentColor"/></svg>`;
        td.appendChild(span);
      });
    }
  }
}

function parseSize(text) {
  if (!text) return null;
  const m = text.trim().match(/^([\d,.]+)\s*(bytes|byte|b|kb|mb|gb|tb|pb)?$/i);
  if (!m) return null;
  const num = parseFloat(m[1].replace(/,/g, ''));
  if (!isFinite(num)) return null;
  const u = (m[2] || '').toLowerCase();
  const mult = { '':1,'b':1,'byte':1,'bytes':1,
                 'kb':1024,'mb':1024**2,'gb':1024**3,'tb':1024**4,'pb':1024**5 };
  return num * (mult[u] || 1);
}

function buildSidebar(visibleSections, byAnchor, issues) {
  const navEl = document.getElementById('sidebar-nav');
  navEl.innerHTML = '';

  if (!SECTION_GROUPS || SECTION_GROUPS.length === 0) {
    // Flat list
    for (const s of visibleSections) navEl.appendChild(navLink(s, issues.get(s.anchor)));
    return;
  }

  // Grouped: render each group, then collect uncategorized into "Other"
  const usedAnchors = new Set();
  for (const grp of SECTION_GROUPS) {
    const items = (grp.sections || [])
      .map(a => byAnchor.get(a))
      .filter(Boolean);
    if (items.length === 0) continue;

    const head = document.createElement('div');
    head.className = 'sidebar-section';
    head.textContent = grp.label;
    navEl.appendChild(head);

    for (const s of items) {
      navEl.appendChild(navLink(s, issues.get(s.anchor)));
      usedAnchors.add(s.anchor);
    }
  }

  // Uncategorized fallback
  const leftover = visibleSections.filter(s => !usedAnchors.has(s.anchor));
  if (leftover.length > 0) {
    const head = document.createElement('div');
    head.className = 'sidebar-section';
    head.textContent = LABELS.uncategorized;
    navEl.appendChild(head);
    for (const s of leftover) navEl.appendChild(navLink(s, issues.get(s.anchor)));
  }
}

function navLink(section, issues) {
  const a = document.createElement('a');
  a.href = '#sec-' + cssEscape(section.anchor);
  // Full-text search: title + section text body. Cap at 50K chars to keep
  // dataset attribute reasonable across 56 sections.
  const idxText = (section.title + ' ' + (section.text || '')).toLowerCase();
  a.dataset.search = idxText.length > 50000 ? idxText.slice(0, 50000) : idxText;
  let stamp = '';
  if (issues) {
    if (issues.crit)      stamp = `<span class="nav-stamp crit">${issues.crit}</span>`;
    else if (issues.warn) stamp = `<span class="nav-stamp">${issues.warn}</span>`;
  }
  a.innerHTML = `${escapeHtml(section.title)}${stamp}`;
  // Click-to-open the matching <details>
  a.addEventListener('click', () => {
    const d = document.getElementById('sec-' + cssEscape(section.anchor));
    if (d) d.open = true;
  });
  return a;
}

function heroCard(sev, num, label) {
  const el = document.createElement('div');
  el.className = 'hero-card ' + sev;
  el.innerHTML = `<div class="hero-num ${sev}">${num}</div><div class="hero-label">${escapeHtml(label)}</div>`;
  return el;
}

function severityBlock(sev, items) {
  const block = document.createElement('div');
  const expanded = (DEFAULTS.expandedBlocks || []).includes(sev);
  block.className = 'sev-block ' + sev + (expanded ? '' : ' collapsed');
  const sevLabel = { crit: LABELS.heroCritical, warn: LABELS.heroWarnings, note: LABELS.heroNotices }[sev];
  const sevIcon  = { crit: '⛔', warn: '⚠', note: 'ⓘ' }[sev];
  block.innerHTML = `
    <div class="sev-head">
      <span class="icon">${sevIcon}</span>
      <span>${escapeHtml(sevLabel)}</span>
      <span class="count">${items.length} item${items.length>1?'s':''}</span>
      <span class="chev">›</span>
    </div>
    <div class="sev-body"></div>
  `;
  block.querySelector('.sev-head').addEventListener('click', () => block.classList.toggle('collapsed'));
  const body = block.querySelector('.sev-body');
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'obs ' + sev;
    const link = it.link
      ? `<a class="goto" href="#sec-${cssEscape(it.link.replace(/^#/, ''))}">view → ${escapeHtml(it.linkLabel)}</a>`
      : '';
    const sevText = sev === 'crit' ? 'critical' : sev === 'warn' ? 'warning' : 'notice';
    row.innerHTML = `
      <span class="badge" title="${escapeHtml(it.why)}">${sevText}</span>
      <span class="text">${escapeHtml(it.label)}<br><span class="why">${escapeHtml(it.why)}</span></span>
      ${link}
    `;
    body.appendChild(row);
  }
  return block;
}

function wireSearch() {
  const navEl = document.getElementById('sidebar-nav');
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => {
    const q = searchEl.value.toLowerCase().trim();
    // Pass 1: show/hide each link based on full-text match
    for (const child of navEl.children) {
      if (child.tagName === 'A') {
        child.classList.toggle('hidden', q && !child.dataset.search.includes(q));
      }
    }
    // Pass 2: hide group headings whose entire group is now hidden
    let currentHead = null;
    let groupHasVisible = false;
    const flush = () => {
      if (currentHead) currentHead.classList.toggle('hidden', q && !groupHasVisible);
    };
    for (const child of navEl.children) {
      if (child.classList.contains('sidebar-section')) {
        flush();
        currentHead = child;
        groupHasVisible = false;
      } else if (child.tagName === 'A') {
        if (!child.classList.contains('hidden')) groupHasVisible = true;
      }
    }
    flush();
  });
}

function wireTheme() {
  const themetoggle = document.getElementById('themetoggle');
  themetoggle.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const v = b.dataset.themeSet;
    document.body.dataset.theme = (v === 'auto' ? '' : v);
    for (const c of themetoggle.children) c.classList.toggle('active', c === b);
  });
}

function wireRubricModal() {
  document.getElementById('show-rubric').addEventListener('click', e => {
    e.preventDefault();
    populateRubric();
    document.getElementById('rubric-modal').classList.add('open');
  });
  document.getElementById('rubric-close').addEventListener('click', () => {
    document.getElementById('rubric-modal').classList.remove('open');
  });
  document.getElementById('rubric-modal').addEventListener('click', e => {
    if (e.target.id === 'rubric-modal') e.currentTarget.classList.remove('open');
  });
}

function wireScrollSpy() {
  const navEl = document.getElementById('sidebar-nav');
  const navByAnchor = new Map();
  for (const a of navEl.querySelectorAll('a')) navByAnchor.set(a.getAttribute('href'), a);
  const sectionEls = [...document.querySelectorAll('details.section')];
  const io = new IntersectionObserver(entries => {
    for (const ent of entries) {
      const a = navByAnchor.get('#' + ent.target.id);
      if (!a) continue;
      if (ent.isIntersecting) {
        for (const x of navEl.querySelectorAll('a')) x.classList.remove('active');
        a.classList.add('active');
      }
    }
  }, { rootMargin: '-30% 0px -65% 0px' });
  for (const s of sectionEls) io.observe(s);
}

function populateRubric() {
  const t = document.getElementById('rubric-table');
  t.innerHTML = '<tr><th>Severity</th><th>Pattern matches</th><th>Why</th></tr>';
  for (const r of RUBRIC) {
    const sevText = r.sev === 'crit' ? 'critical' : r.sev === 'warn' ? 'warning' : 'notice';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span style="background:var(--${r.sev}-bd);color:white;padding:.1rem .4rem;border-radius:3px;font-size:.7rem;font-weight:600;text-transform:uppercase">${sevText}</span></td>
      <td>${escapeHtml(r.label)}</td>
      <td>${escapeHtml(r.why)}</td>
    `;
    t.appendChild(tr);
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cssEscape(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

/* ###########################################################
 * #                                                         #
 * #              4. BOOTSTRAP — file loading                #
 * #                                                         #
 * ########################################################### */

const dropzone = document.getElementById('dropzone');
const filepick = document.getElementById('filepick');
const errEl = document.getElementById('err');

function loadFile(file) {
  errEl.classList.add('hidden');
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = parseReport(r.result);
      // Expose parsed data globally so future tooling (sqlite export,
      // diff, CLI batch converter) can consume it without re-parsing.
      window.pgcReport = parsed;
      render(parsed);
    } catch (e) {
      errEl.textContent = 'Could not parse: ' + e.message;
      errEl.classList.remove('hidden');
      console.error(e);
    }
  };
  r.onerror = () => {
    errEl.textContent = 'Read failed: ' + r.error;
    errEl.classList.remove('hidden');
  };
  r.readAsText(file);
}

filepick.addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', e => loadFile(e.dataTransfer.files && e.dataTransfer.files[0]));

// Apply labels to static markup, then bootstrap
applyLabels();
applyInitialTheme();

// Optional: ?report=<url> auto-loads
(async () => {
  const url = new URLSearchParams(location.search).get('report');
  if (!url) return;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    const parsed = parseReport(await r.text());
    window.pgcReport = parsed;
    render(parsed);
  } catch (e) {
    errEl.textContent = 'Failed to load ?report=' + url + ': ' + e.message;
    errEl.classList.remove('hidden');
  }
})();
</script>
