<!doctype html>
<!-- ===========================================================================
     pg_collector enhance.html — modern viewer for pg_collector reports
     ---------------------------------------------------------------------------
     Static, browser-only post-processor. Drop a pg_collector_*.html onto this
     page (or pass ?report=URL) and it renders a modern UI on top of the
     existing report DOM. Zero changes to pg_collector.sql.

     ┌─ HOW TO CUSTOMIZE ──────────────────────────────────────────────────┐
     │                                                                     │
     │   Look & feel  → CSS tokens at the top of <style>                   │
     │                  (search for "DESIGN TOKENS" — every color, font,   │
     │                  spacing, shadow lives there).                      │
     │                                                                     │
     │   Add a theme  → add a [data-theme=NAME] block in <style>           │
     │                  (copy [data-theme=light] as a template) AND add a  │
     │                  matching <button> to the .theme-toggle in the      │
     │                  sidebar markup.                                    │
     │                                                                     │
     │   Severity     → edit RUBRIC[] in <script>                          │
     │                                                                     │
     │   Section      → edit SECTION_GROUPS[] in <script>                  │
     │   grouping       (sections not listed go to "Other" automatically). │
     │                                                                     │
     │   Wording      → edit LABELS{} in <script> (titles, button copy,    │
     │                  footer note, etc.)                                 │
     │                                                                     │
     │   Initial      → edit DEFAULTS{} in <script> (which severity blocks │
     │   state          start expanded, hide empty sections, theme).       │
     │                                                                     │
     │   Layout       → search for "// LAYOUT" in <script> and ".app" in   │
     │                  <style>. Most layout decisions are CSS grid.       │
     │                                                                     │
     └─────────────────────────────────────────────────────────────────────┘

     File structure:
       1. <style>     — CSS, organized as tokens then components
       2. <body>      — minimal markup (drop zone + app shell containers)
       3. <script>
          a. CONFIG   — RUBRIC, SECTION_GROUPS, LABELS, DEFAULTS  ← edit here
          b. PARSING  — extracts structured data from the report DOM
          c. RENDER   — builds the modern UI

     See tools/README.md for worked examples of each customization.
=========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pg_collector report — modern view</title>
<style>
  /* ============================================================
   * DESIGN TOKENS — colors, spacing, shadows
   * ----------------------------------------------------------
   * All themable values live here. Each [data-theme=NAME]
   * block must define the same token set. To add a theme:
   *
   *   1. Copy a complete [data-theme=light] (or dark) block
   *   2. Rename to [data-theme=YOURNAME]
   *   3. Adjust colors as desired
   *   4. Add a <button data-theme-set="YOURNAME"> to the
   *      .theme-toggle in the sidebar markup
   * ============================================================ */

  :root {
    /* Material 3 surface tonal palette, tinted with Postgres blue (#336791).
     * 5 surface levels go from page background up to most-elevated card.
     * "On-surface" tokens are foreground colors that match contrast spec. */
    --primary:        #2c5d8f;   /* Postgres blue, slightly desaturated for text comfort */
    --primary-hover:  #1d4972;
    --primary-on:     #ffffff;

    --bg:             #f5f7fa;   /* Body */
    --surface:        #ffffff;   /* Cards, panels */
    --surface-2:      #eef2f6;   /* Hover, secondary surfaces */
    --surface-3:      #e3e9f1;   /* Tertiary, badges */
    --border:         #d6dce4;
    --text:           #0f1a2a;
    --muted:          #5e6878;
    --accent:         var(--primary);

    /* Severity palette — softened to fit M3 tonal aesthetic */
    --crit-bg: #fde7e9; --crit-fg: #71121f; --crit-bd: #e07683;
    --warn-bg: #fff4c8; --warn-fg: #5e3500; --warn-bd: #d4a72c;
    --note-bg: #e0eefb; --note-fg: #0a3a6a; --note-bd: #6cabe2;
    --ok-bg:   #def5e6; --ok-fg:   #103a23; --ok-bd:   #4caf6d;

    /* Effects — M3 elevations 1, 2, 3 */
    --elev-1: 0 1px 2px rgba(15, 26, 42, 0.04), 0 1px 3px rgba(15, 26, 42, 0.06);
    --elev-2: 0 2px 4px rgba(15, 26, 42, 0.06), 0 4px 8px rgba(15, 26, 42, 0.04);
    --elev-3: 0 4px 8px rgba(15, 26, 42, 0.08), 0 8px 16px rgba(15, 26, 42, 0.06);
    --shadow: var(--elev-1);

    /* Shape — M3 favors larger radii than legacy designs */
    --radius:    12px;
    --radius-sm: 6px;
    --radius-pill: 999px;
  }

  /* OS-driven dark mode (when [data-theme] is unset) */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary:        #6fa8d6;
      --primary-hover:  #8cbde6;
      --primary-on:     #0a1929;

      --bg:             #0a1018;
      --surface:        #131a25;
      --surface-2:      #1a2230;
      --surface-3:      #232c3d;
      --border:         #2a3447;
      --text:           #e8edf4;
      --muted:          #8d96a8;
      --accent:         var(--primary);

      --crit-bg: #3a0d18; --crit-fg: #ff9da8; --crit-bd: #b94656;
      --warn-bg: #3a2a06; --warn-fg: #f4cc55; --warn-bd: #9c7110;
      --note-bg: #0a2950; --note-fg: #82bcef; --note-bd: #1d5fad;
      --ok-bg:   #0a3019; --ok-fg:   #6fcc8e; --ok-bd:   #2a8b46;

      --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
      --elev-2: 0 2px 4px rgba(0, 0, 0, 0.35), 0 4px 8px rgba(0, 0, 0, 0.3);
      --elev-3: 0 4px 8px rgba(0, 0, 0, 0.4), 0 8px 16px rgba(0, 0, 0, 0.35);
      --shadow: var(--elev-1);
    }
  }

  /* User-selected themes (override OS). To add a theme, copy one of these
   * blocks, rename, and add a matching <button data-theme-set="..."> in
   * the sidebar markup. */
  [data-theme=light] {
    color-scheme: light;
    --primary:#2c5d8f;--primary-hover:#1d4972;--primary-on:#fff;
    --bg:#f5f7fa;--surface:#fff;--surface-2:#eef2f6;--surface-3:#e3e9f1;
    --border:#d6dce4;--text:#0f1a2a;--muted:#5e6878;--accent:var(--primary);
    --crit-bg:#fde7e9;--crit-fg:#71121f;--crit-bd:#e07683;
    --warn-bg:#fff4c8;--warn-fg:#5e3500;--warn-bd:#d4a72c;
    --note-bg:#e0eefb;--note-fg:#0a3a6a;--note-bd:#6cabe2;
    --ok-bg:#def5e6;--ok-fg:#103a23;--ok-bd:#4caf6d;
    --elev-1:0 1px 2px rgba(15,26,42,.04),0 1px 3px rgba(15,26,42,.06);
    --elev-2:0 2px 4px rgba(15,26,42,.06),0 4px 8px rgba(15,26,42,.04);
    --elev-3:0 4px 8px rgba(15,26,42,.08),0 8px 16px rgba(15,26,42,.06);
    --shadow:var(--elev-1);
  }
  [data-theme=dark] {
    color-scheme: dark;
    --primary:#6fa8d6;--primary-hover:#8cbde6;--primary-on:#0a1929;
    --bg:#0a1018;--surface:#131a25;--surface-2:#1a2230;--surface-3:#232c3d;
    --border:#2a3447;--text:#e8edf4;--muted:#8d96a8;--accent:var(--primary);
    --crit-bg:#3a0d18;--crit-fg:#ff9da8;--crit-bd:#b94656;
    --warn-bg:#3a2a06;--warn-fg:#f4cc55;--warn-bd:#9c7110;
    --note-bg:#0a2950;--note-fg:#82bcef;--note-bd:#1d5fad;
    --ok-bg:#0a3019;--ok-fg:#6fcc8e;--ok-bd:#2a8b46;
    --elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
    --elev-2:0 2px 4px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.3);
    --elev-3:0 4px 8px rgba(0,0,0,.4),0 8px 16px rgba(0,0,0,.35);
    --shadow:var(--elev-1);
  }

  /* ============================================================
   * BASE TYPOGRAPHY — M3 type scale
   * Display:   28-34px (page title)
   * Headline:  18-22px (section heading)
   * Title:     14-16px (cards, subsection)
   * Body:      14px    (default)
   * Label:     11-12px (chips, badges, captions)
   * ============================================================ */
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI Variable",
                    "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -.005em;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono",
                                  Menlo, Consolas, "Liberation Mono", monospace; }
  a { color: var(--accent); text-decoration: none; transition: color .15s ease; }
  a:hover { color: var(--primary-hover); text-decoration: underline; text-underline-offset: 2px; }
  ::selection { background: var(--primary); color: var(--primary-on); }
  h1, h2, h3, h4 { letter-spacing: -.015em; }

  /* ============================================================
   * DROP ZONE (initial state, before a file is loaded)
   * ============================================================ */
  .dropzone { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
  .dropzone .card {
    max-width: 640px; width: 100%; padding: 3rem 2.5rem;
    background: var(--surface); border: 2px dashed var(--border);
    border-radius: 12px; text-align: center; transition: all .15s ease;
  }
  .dropzone.dragover .card { border-color: var(--accent); background: var(--surface-2); }
  .dropzone h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  .dropzone p  { color: var(--muted); margin: .25rem 0; }
  .dropzone .hint { font-size: .85rem; margin-top: 1.25rem; }
  .dropzone input[type=file] { display: none; }
  .dropzone label.btn {
    display: inline-block; margin-top: 1rem; padding: .55rem 1.25rem;
    background: var(--accent); color: white; border-radius: var(--radius-sm);
    cursor: pointer; font-weight: 500; transition: opacity .15s;
  }
  .dropzone label.btn:hover { opacity: .9; }
  .err { color: var(--crit-fg); background: var(--crit-bg); padding: .75rem 1rem;
         border: 1px solid var(--crit-bd); border-radius: var(--radius-sm);
         margin-top: 1rem; text-align: left; }

  /* ============================================================
   * APP SHELL — sidebar + main grid
   * ----------------------------------------------------------
   * To change the layout (e.g., move sidebar to the right,
   * change widths, single column always), edit the .app rule.
   * ============================================================ */
  .app { display: grid; grid-template-columns: 280px minmax(0,1fr); min-height: 100vh; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display:none; }   /* see TODO: hamburger toggle */
  }

  /* ============================================================
   * SIDEBAR — Material 3 navigation drawer aesthetic
   * ============================================================ */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 1.5rem 0 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar-head { padding: 0 1.25rem 1.25rem; border-bottom: 1px solid var(--border); }
  .sidebar-brand {
    display: flex; align-items: center; gap: .65rem;
    font-weight: 600; font-size: 1.05rem; letter-spacing: -.02em;
  }
  .sidebar-brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--primary); color: var(--primary-on);
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    letter-spacing: -.5px;
    box-shadow: var(--elev-1);
  }
  .sidebar-brand .logo svg { width: 22px; height: 22px; }
  .sidebar-version { font-size: .72rem; color: var(--muted); margin-top: .35rem;
                     font-weight: 500; letter-spacing: .02em; }
  .sidebar-search {
    width: 100%; margin-top: 1rem; padding: .55rem .8rem;
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--text);
    font-size: .85rem; font-family: inherit;
    transition: all .15s ease;
  }
  .sidebar-search:focus {
    outline: none; border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(44,93,143,.15);
  }
  .sidebar-search::placeholder { color: var(--muted); }

  .sidebar-section {
    padding: 1.25rem 1.25rem .35rem;
    font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600;
  }
  .sidebar nav a {
    display: flex; align-items: center; gap: .5rem;
    padding: .5rem 1.25rem; font-size: .85rem; color: var(--text);
    border-left: 3px solid transparent;
    transition: all .12s ease;
    line-height: 1.3;
  }
  .sidebar nav a:hover {
    background: var(--surface-2); text-decoration: none;
    color: var(--primary);
  }
  .sidebar nav a.active {
    color: var(--primary); border-left-color: var(--primary);
    background: var(--surface-2); font-weight: 500;
  }
  .sidebar nav a.hidden, .sidebar-section.hidden { display: none; }
  .sidebar nav a .nav-stamp {
    margin-left: auto; font-size: .65rem; padding: .1rem .45rem;
    border-radius: var(--radius-pill);
    background: var(--warn-bd); color: white; font-weight: 700;
  }
  .sidebar nav a .nav-stamp.crit { background: var(--crit-bd); }

  .sidebar-foot {
    margin-top: 1.5rem; padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    font-size: .75rem; color: var(--muted);
  }
  .sidebar-foot a { color: var(--primary); }
  .theme-toggle {
    display: flex; gap: 2px; margin-bottom: .85rem;
    padding: 2px; background: var(--surface-2);
    border-radius: var(--radius-pill); border: 1px solid var(--border);
  }
  .theme-toggle button {
    flex: 1; padding: .3rem .55rem; font-size: .72rem;
    cursor: pointer; background: transparent; border: none;
    border-radius: var(--radius-pill); color: var(--muted);
    font-weight: 500; font-family: inherit;
    transition: all .12s ease;
  }
  .theme-toggle button.active {
    background: var(--surface); color: var(--text);
    box-shadow: var(--elev-1);
  }

  /* ============================================================
   * MAIN content area
   * ============================================================ */
  .main { padding: 2rem 2.25rem 5rem; max-width: 1180px; }
  @media (max-width: 600px) { .main { padding: 1rem; } }

  .topbar {
    display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center;
    margin-bottom: 1.75rem; padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    margin: 0; font-size: 1.5rem; font-weight: 600; line-height: 1.2;
    color: var(--text); letter-spacing: -.02em;
  }
  .topbar h1 .accent { color: var(--primary); }
  .pill {
    display: inline-flex; align-items: center; gap: .4rem; padding: .25rem .7rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: .78rem; color: var(--muted); font-weight: 500;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok-bd); }
  .pill.standby .dot { background: var(--note-bd); }

  /* Hero status cards — M3 elevation 1 */
  .hero {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: .85rem; margin: 1.5rem 0;
  }
  .hero-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.1rem 1.35rem;
    box-shadow: var(--elev-1);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .hero-card:hover { box-shadow: var(--elev-2); transform: translateY(-1px); }
  .hero-card.crit { border-left: 3px solid var(--crit-bd); }
  .hero-card.warn { border-left: 3px solid var(--warn-bd); }
  .hero-card.note { border-left: 3px solid var(--note-bd); }
  .hero-card.ok   { border-left: 3px solid var(--ok-bd); }
  .hero-num {
    font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -.03em;
    font-feature-settings: "tnum"; /* tabular numerals for alignment */
  }
  .hero-num.crit { color: var(--crit-fg); }
  .hero-num.warn { color: var(--warn-fg); }
  .hero-num.note { color: var(--note-fg); }
  .hero-num.ok   { color: var(--ok-fg); }
  .hero-label { font-size: .82rem; color: var(--muted); margin-top: .35rem;
                font-weight: 500; }

  /* Severity blocks (grouped findings) — M3 elevation 1 */
  .sev-block {
    margin-bottom: 1rem; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: var(--elev-1);
    transition: box-shadow .18s ease;
  }
  .sev-block:hover { box-shadow: var(--elev-2); }
  .sev-block.crit { border-left: 4px solid var(--crit-bd); }
  .sev-block.warn { border-left: 4px solid var(--warn-bd); }
  .sev-block.note { border-left: 4px solid var(--note-bd); }
  .sev-head {
    display: flex; align-items: center; gap: .75rem; padding: 1rem 1.35rem;
    font-weight: 600; font-size: .95rem; cursor: pointer; user-select: none;
    letter-spacing: -.005em;
  }
  .sev-block.crit .sev-head { background: var(--crit-bg); color: var(--crit-fg); }
  .sev-block.warn .sev-head { background: var(--warn-bg); color: var(--warn-fg); }
  .sev-block.note .sev-head { background: var(--note-bg); color: var(--note-fg); }
  .sev-head .icon  { font-size: 1.15rem; line-height: 1; }
  .sev-head .count { margin-left: auto; font-size: .8rem; opacity: .75; font-weight: 500;
                     padding: .15rem .55rem; border-radius: var(--radius-pill);
                     background: rgba(0,0,0,.06); }
  .sev-head .chev  { transition: transform .2s ease; opacity: .7; }
  .sev-block.collapsed .sev-head .chev { transform: rotate(-90deg); }
  .sev-block.collapsed .sev-body { display: none; }
  .sev-body { padding: .35rem 0; background: var(--surface); }
  .obs {
    display: grid; grid-template-columns: 110px 1fr auto; gap: 1rem;
    align-items: center; padding: .85rem 1.35rem;
    border-top: 1px solid var(--border);
    transition: background .15s ease;
  }
  .obs:hover { background: var(--surface-2); }
  .obs:first-child { border-top: none; }
  .obs .badge {
    display: inline-flex; align-items: center; padding: .25rem .65rem;
    border-radius: var(--radius-pill); font-size: .68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; cursor: help;
    line-height: 1.2;
  }
  .obs.crit .badge { background: var(--crit-bd); color: white; }
  .obs.warn .badge { background: var(--warn-bd); color: white; }
  .obs.note .badge { background: var(--note-bd); color: white; }
  .obs .text { color: var(--text); font-weight: 500; line-height: 1.4; }
  .obs .text a { color: var(--accent); }
  .obs .why  { font-size: .78rem; color: var(--muted); font-weight: 400;
               margin-top: .2rem; display: block; }
  .obs .goto {
    font-size: .8rem; padding: .35rem .75rem; border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--text); font-weight: 500;
    border: 1px solid var(--border);
    transition: all .15s ease;
  }
  .obs .goto:hover { background: var(--primary); color: var(--primary-on);
                     border-color: var(--primary); text-decoration: none; }

  /* DB overview cards — slightly elevated, hover lifts */
  .db-grid {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
    gap: .85rem; margin-bottom: 2rem;
  }
  .db-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.15rem;
    box-shadow: var(--elev-1);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .db-card:hover { box-shadow: var(--elev-2); transform: translateY(-1px); }
  .db-card .lbl {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600;
  }
  .db-card .val {
    margin-top: .35rem; font-size: 1rem; color: var(--text); font-weight: 500;
    line-height: 1.3; word-break: break-word;
  }

  /* Inline size-bar visualization (no charting library). */
  .sizebar { display: inline-block; vertical-align: middle; margin-left: .5rem;
             color: var(--accent); opacity: .6; }
  .sizebar svg { display: block; }

  /* DB Parameters — toolbar, tuning form, grouped param rows */
  .params-toolbar {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    margin: .5rem 0 1rem; padding: .65rem; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .params-toolbar input[type=search],
  .params-toolbar select,
  .params-toolbar input[type=number] {
    padding: .35rem .55rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface);
    color: var(--text); font-size: .85rem; font-family: inherit;
  }
  .params-toolbar input[type=search] { min-width: 220px; flex: 1 0 200px; }
  .params-toolbar .toggle-lbl { font-size: .85rem; color: var(--text); display: inline-flex; gap: .35rem; align-items: center; }
  .params-toolbar button {
    padding: .35rem .85rem; cursor: pointer; background: var(--accent);
    color: white; border: 1px solid var(--accent); border-radius: var(--radius-sm);
    font-size: .85rem; font-weight: 500;
  }
  .params-toolbar button.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .params-toolbar button:hover { opacity: .9; }
  .params-stats { font-size: .8rem; color: var(--muted); margin-left: auto; }

  .params-tune {
    margin: 0 0 1rem; padding: 1rem 1.25rem; background: var(--note-bg);
    border: 1px solid var(--note-bd); border-radius: var(--radius);
  }
  .params-tune.hidden { display: none; }
  .params-tune h4 { margin: 0 0 .5rem; font-size: .95rem; color: var(--note-fg); }
  .params-tune-form {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
    gap: .75rem .85rem; align-items: end;
  }
  .params-tune-form label { font-size: .75rem; color: var(--muted); text-transform: uppercase;
                            letter-spacing: .04em; font-weight: 600; display: block; }
  .params-tune-form .field input,
  .params-tune-form .field select {
    width: 100%; padding: .35rem .55rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
    font-size: .85rem; margin-top: .15rem;
  }
  .params-tune-actions { margin-top: .85rem; display: flex; gap: .5rem; align-items: center; }

  .params-list { display: grid; gap: .5rem; }
  .params-group {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .params-group > summary {
    list-style: none; padding: .55rem .85rem; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: .65rem; font-weight: 600; font-size: .9rem;
  }
  .params-group > summary::-webkit-details-marker { display: none; }
  .params-group > summary .chev { color: var(--muted); transition: transform .15s; font-size: .8rem; }
  .params-group[open] > summary .chev { transform: rotate(90deg); }
  .params-group > summary .gname { flex: 1; }
  .params-group > summary .gcount { font-size: .75rem; color: var(--muted); }
  .params-group > summary .gnondefault {
    font-size: .7rem; padding: .1rem .4rem; border-radius: 4px; font-weight: 600;
    background: var(--warn-bg); color: var(--warn-fg);
  }

  .param-row {
    display: grid; grid-template-columns: 220px 1fr 90px;
    gap: .65rem 1rem; padding: .5rem .85rem; border-top: 1px solid var(--border);
    font-size: .85rem; align-items: baseline;
  }
  .param-row.non-default { background: linear-gradient(to right, var(--warn-bg) 0, var(--warn-bg) 3px, transparent 3px); }
  .param-row.hidden { display: none; }
  .param-row .pname { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; }
  .param-row .pvalue { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; }
  .param-row .pvalue .unit { color: var(--muted); font-size: .75rem; margin-left: .15rem; }
  .param-row .psource { font-size: .7rem; padding: .1rem .4rem; border-radius: 4px;
                        background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
                        text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
                        text-align: center; }
  .param-row .psource.non-default { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
  .param-row .pdesc { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); margin-top: .15rem; }
  .param-row .ptune {
    grid-column: 2 / 3; font-size: .75rem; color: var(--note-fg);
    background: var(--note-bg); padding: .15rem .45rem; border-radius: 4px;
    border: 1px solid var(--note-bd); margin-top: .25rem;
    display: inline-block; align-self: start;
  }
  .param-row .ptune.divergent { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }

  .params-raw-toggle { margin-top: 1rem; }
  .params-raw-table { display: none; margin-top: 1rem; }
  .params-raw-table.visible { display: block; }

  /* Section blocks (the original content, restyled) */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: .85rem; overflow: hidden;
    box-shadow: var(--elev-1);
    transition: box-shadow .18s ease;
  }
  .section:hover { box-shadow: var(--elev-2); }
  .section > summary {
    list-style: none; padding: 1rem 1.35rem; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: .75rem;
    font-weight: 600; font-size: .95rem; letter-spacing: -.005em;
  }
  .section > summary::-webkit-details-marker { display: none; }
  .section > summary:hover { background: var(--surface-2); }
  .section > summary .chev {
    color: var(--muted); transition: transform .2s ease; font-size: .85rem;
  }
  .section[open] > summary .chev { transform: rotate(90deg); }
  .section > summary .name { flex: 1; }
  .section > summary .stamp {
    font-size: .7rem; padding: .25rem .65rem; border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
    font-weight: 600; letter-spacing: .03em;
  }
  .section > summary .stamp.has-issue { background: var(--warn-bg); color: var(--warn-fg);
                                        border-color: var(--warn-bd); }
  .section > summary .stamp.has-crit  { background: var(--crit-bg); color: var(--crit-fg);
                                        border-color: var(--crit-bd); }
  .section-body { padding: .25rem 1.35rem 1.5rem; overflow-x: auto;
                  border-top: 1px solid var(--border); }

  /* Restyled psql tables — quiet, dense, sortable.
   * Numeric columns are detected and right-aligned with tabular numerals
   * and a monospaced font. Click any header to sort (asc → desc → unsorted).
   */
  .section-body table {
    border-collapse: collapse; margin: 1rem 0; font-size: .82rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    width: 100%; max-width: 100%; background: var(--surface);
    table-layout: auto;
  }
  .section-body table th {
    background: var(--surface-2); color: var(--muted);
    padding: .5rem .85rem; text-align: left; font-weight: 600; font-size: .78rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer; user-select: none; position: relative;
    transition: color .12s ease, background .12s ease;
  }
  .section-body table th:hover { color: var(--text); background: var(--surface-3); }
  .section-body table th::after {
    content: ""; position: absolute; right: .55rem; top: 50%;
    width: 0; height: 0; opacity: 0;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    transition: opacity .12s ease;
  }
  .section-body table th:hover::after { opacity: .35;
    border-top: 5px solid var(--muted); margin-top: -2px; }
  .section-body table th.sort-asc { color: var(--primary); background: var(--surface-3); }
  .section-body table th.sort-asc::after {
    opacity: 1; border-bottom: 5px solid var(--primary);
    border-top: none; margin-top: -3px;
  }
  .section-body table th.sort-desc { color: var(--primary); background: var(--surface-3); }
  .section-body table th.sort-desc::after {
    opacity: 1; border-top: 5px solid var(--primary);
    border-bottom: none; margin-top: -2px;
  }
  .section-body table td {
    padding: .45rem .85rem; border-top: 1px solid var(--border);
    text-align: left; word-break: break-word; vertical-align: baseline;
    color: var(--text); font-size: .82rem; line-height: 1.4;
  }
  .section-body table td.numeric {
    text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-feature-settings: "tnum"; font-size: .8rem; white-space: nowrap;
  }
  .section-body table th.numeric { text-align: right; }
  .section-body table th.numeric::after { left: .55rem; right: auto; }
  .section-body table th.numeric:hover::after,
  .section-body table th.numeric.sort-asc::after,
  .section-body table th.numeric.sort-desc::after { left: .55rem; right: auto; }
  .section-body table tr:first-child td { border-top: none; }
  .section-body table tr:nth-child(even) td { background: var(--bg); }
  .section-body table tr:hover td { background: var(--note-bg); }

  .section-body h2, .section-body h3, .section-body h4 {
    color: var(--text); margin: 1.5rem 0 .5rem;
    font-size: 1rem; font-weight: 600; letter-spacing: -.005em;
  }
  .section-body h4 { font-size: .88rem; color: var(--muted); font-weight: 500;
                     letter-spacing: 0; }
  .section-body hr { display: none; }
  .section-body br { display: none; }
  .section-body p  { margin: .5rem 0; color: var(--muted); font-size: .85rem; }
  .section-body font[size="+2"] { /* psql section subtitles */
    font-size: 1rem; font-weight: 600; color: var(--text);
    display: block; margin: 1.25rem 0 .35rem;
  }

  /* Severity rubric modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    max-width: 720px; width: 92%; max-height: 80vh; overflow-y: auto;
    padding: 1.5rem 1.75rem; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
  .modal table { width: 100%; border-collapse: collapse; font-size: .85rem;
                 margin-top: .75rem; }
  .modal th, .modal td { padding: .5rem .75rem; border-bottom: 1px solid var(--border);
                         text-align: left; }
  .modal th { color: var(--muted); font-weight: 600; }
  .modal .close {
    float: right; padding: .25rem .65rem; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2);
    border-radius: var(--radius-sm); color: var(--text); font-size: .85rem;
  }

  .footer {
    margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);
    font-size: .8rem; color: var(--muted);
  }
  .footer a { color: var(--accent); }

  /* Utilities */
  .hidden { display: none !important; }
</style>
</head>
